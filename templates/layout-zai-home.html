<!DOCTYPE html>
<html lang="en">
<head>
{{ template "partials/head.html" . }}
</head>
<body class="z-body">
{{ template "partials/nav.html" . }}
<section class="z-hero z-wrap">
  <div class="z-hero-copy">
    <h1 class="z-hero-title">{{.Title}}</h1>
    <p class="z-hero-sub">{{.Description}}</p>
    <div class="z-hero-ctas">
      <a class="z-btn z-btn--primary" href="/chat/">Chat on Z.ai</a>
      <a class="z-btn z-btn--ghost" href="/code/">Code on Z.ai</a>
    </div>
  </div>
  <figure class="z-hero-art" aria-hidden="true">
    <img class="z-art-light" src="/assets/img/paper-a.webp" alt="" width="1600" height="1600">
    <img class="z-art-dark" src="/assets/img/paper-b.webp" alt="" width="1400" height="1400">
  </figure>
</section>
<main id="main-content" class="z-main">
  <article class="z-article z-wrap">
    <div class="z-prose">
      {{.Content}}
    </div>
  </article>
</main>
{{ template "partials/footer.html" . }}
<script src="/assets/js/zai.js" defer></script>
<script src="/assets/js/search.js" defer></script>
</body>
</html>
