<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{if eq .Title .Site.SiteName}}{{.Title}}{{else}}{{.Title}} | {{.Site.SiteName}}{{end}}</title>
<meta name="description" content="{{.Description}}">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:image" content="{{if .Image}}{{.Image}}{{else}}{{.Site.SiteURL}}{{.Site.DefaultOGImage}}{{end}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.Title}}">
<meta name="twitter:description" content="{{.Description}}">
<meta name="twitter:image" content="{{if .Image}}{{.Image}}{{else}}{{.Site.SiteURL}}{{.Site.DefaultOGImage}}{{end}}">
{{if .CanonicalURL}}<link rel="canonical" href="{{.CanonicalURL}}">
<meta property="og:url" content="{{.CanonicalURL}}">{{end}}
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="alternate" type="application/rss+xml" title="{{.Site.SiteName}}" href="/feed.xml">
<link rel="preload" href="/assets/fonts/GeneralSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<script>
(function(){try{var m=localStorage.getItem("zai-theme");if(m==="light"||m==="dark"){document.documentElement.dataset.mode=m;}}catch(e){}})();
</script>
<link rel="stylesheet" href="/assets/css/zai.css">
