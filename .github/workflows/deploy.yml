name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued run.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned generator release. Bump deliberately, not automatically.
  LA_FAMILLE_VERSION: v0.1.0-prealpha
  LA_FAMILLE_REPO: drawmeanelephant/la-famille
  PAGES_PROJECT: z-filed

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check out la-famille release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${LA_FAMILLE_VERSION#v}"
          base="https://github.com/${LA_FAMILLE_REPO}/releases/download/${LA_FAMILLE_VERSION}"
          mkdir -p "$RUNNER_TEMP/la-famille"
          curl --fail --location --silent --show-error \
            "$base/SHA256SUMS" -o "$RUNNER_TEMP/la-famille/SHA256SUMS"
          archive="la-famille_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "$base/$archive" -o "$RUNNER_TEMP/la-famille/$archive"
          cd "$RUNNER_TEMP/la-famille"
          # Keep the manifest's own filename: `sha256sum --check` reads the
          # names in SHA256SUMS, so the archive must be named to match.
          grep " $archive\$" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$archive"
          install -m 0755 la-famille "$RUNNER_TEMP/la-famille-bin"
          "$RUNNER_TEMP/la-famille-bin" --version

      # --project-root stays "." and --output is absolute: a relative
      # project-root silently produces an empty RAG bundle (docs/HOMESTEAD.md B1).
      # Post-processing order mirrors `make publish`: strip, enhance, prune,
      # verify, audit. The artifact audit is the last word before upload: any
      # failed check (or missing/empty input) exits nonzero under
      # `set -euo pipefail`, so nothing reaches Upload/Deploy.
      # Content-only RAG: the export lands outside public/ and only
      # rag-content.md is copied in — rag-system.md (repo workflows, README)
      # and rag-config.md (full file inventory) stay out of the deployment.
      - name: Build and validate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/la-famille-bin" --project-root . check
          "$RUNNER_TEMP/la-famille-bin" --project-root . build
          "$RUNNER_TEMP/la-famille-bin" --project-root . \
            rag --output "$PWD/rag-archive"
          mkdir -p public/rag-archive
          cp rag-archive/rag-content.md public/rag-archive/rag-content.md
          python3 scripts/strip-internal-nofollow.py
          python3 scripts/enhance-artifact.py
          ./scripts/prune-unused-assets.sh
          "$RUNNER_TEMP/la-famille-bin" --project-root . publish-check
          python3 scripts/check-rag-coverage.py
          python3 scripts/audit-artifact.py
          test -s public/rag-archive/rag-content.md
          test -s public/404.html

      - name: Artifact audit regression tests
        run: python3 scripts/test-audit-artifact.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name "${{ env.PAGES_PROJECT }}" --branch main
